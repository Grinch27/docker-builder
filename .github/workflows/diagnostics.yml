name: Diagnostics (Version + Image Layers)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostics.yml"
      - ".github/workflows/callable-fetch-app-version.yml"
      - ".github/workflows/callable-fetch-layers.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Version probe, layers, or both"
        type: choice
        required: true
        default: both
        options: [version, layers, both]
      app_branch:
        description: "Application for version probe"
        type: string
        default: vlmcsd
      tag_repo:
        description: "Version probe tag label"
        type: string
        default: latest
      layer_profile:
        description: "Default images for layer inspection"
        type: choice
        default: stable
        options: [stable, base]
      image_name:
        description: "Single image override for layer inspection"
        type: string
        default: ""

# Called legacy reusable workflows currently request write-all.
permissions: write-all

jobs:
  prepare:
    name: Select diagnostic targets
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - name: Select images
        id: select
        env:
          IMAGE_OVERRIDE: ${{ inputs.image_name || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          LAYER_PROFILE: ${{ inputs.layer_profile || 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${COMMIT_MESSAGE}" != *"[diagnostics-full]"* ]]; then
            images='["alpine:latest"]'
          elif [[ -n "${IMAGE_OVERRIDE}" ]]; then
            images=$(jq -cn --arg name "${IMAGE_OVERRIDE}" '[$name]')
          elif [[ "${LAYER_PROFILE}" == "base" ]]; then
            images='["ubuntu:latest","debian:latest","alpine:latest"]'
          else
            images='["debian:latest","ubuntu:latest","alpine:latest","debian:sid","ubuntu:devel"]'
          fi
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "${images}" >/dev/null
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${COMMIT_MESSAGE}" != *"[diagnostics-full]"* ]]; then
            platforms='[{"image_name":"alpine:latest","arch":"amd64"}]'
          else
            platforms=$(jq -cn --argjson images "${images}" \
              '[$images[] as $image | ["amd64","arm64"][] as $arch | {image_name:$image,arch:$arch}]')
          fi
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"

  version:
    name: App version via canonical probe
    if: ${{ github.event_name == 'push' || inputs.mode == 'version' || inputs.mode == 'both' }}
    uses: ./.github/workflows/callable-fetch-app-version.yml
    with:
      app_branch: ${{ inputs.app_branch || 'vlmcsd' }}
      tag_repo: ${{ inputs.tag_repo || 'latest' }}

  layers:
    name: OCI layers ${{ matrix.image_name }}
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.mode == 'layers' || inputs.mode == 'both' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image_name: ${{ fromJson(needs.prepare.outputs.images) }}
    uses: ./.github/workflows/callable-fetch-layers.yml
    with:
      image_name: ${{ matrix.image_name }}

  platform-details:
    name: Detailed OCI inspect ${{ matrix.image_name }} / ${{ matrix.arch }}
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.mode == 'layers' || inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.platforms) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Install Skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y skopeo jq
      - name: Inspect immutable platform selector
        id: inspect
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/inspect-image-platform.sh "${IMAGE_NAME}" "${ARCH}"
      - name: Upload original stable layer list artifact
        uses: actions/upload-artifact@main
        with:
          name: layers-${{ steps.inspect.outputs.stable_name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/diagnostics/layers.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload original baseimage raw-data artifact
        uses: actions/upload-artifact@main
        with:
          name: layer-info-${{ steps.inspect.outputs.base_name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/diagnostics/image_*.json
          if-no-files-found: error
          retention-days: 1
  collect:
    name: Aggregate OCI Layers
    needs: [prepare, layers]
    if: ${{ github.event_name == 'push' || inputs.mode == 'layers' || inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Download per-image layer artifacts
        uses: actions/download-artifact@main
        with:
          pattern: layers-*
          path: ${{ runner.temp }}/layer-artifacts
      - name: Produce JSON summary
        env:
          LAYER_ARTIFACT_ROOT: ${{ runner.temp }}/layer-artifacts
        run: |
          set -euo pipefail
          python3 scripts/ci/aggregate-layer-artifacts.py "${LAYER_ARTIFACT_ROOT}" "${RUNNER_TEMP}/layer-reports"
      - name: Upload merged layers and status report
        uses: actions/upload-artifact@main
        with:
          name: diagnostics-layer-summary
          path: ${{ runner.temp }}/layer-reports/*.json
          retention-days: 1
          if-no-files-found: error
  validate:
    name: Validate non-publishing diagnostics artifacts
    needs: [version, layers, platform-details, collect]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@main
        with:
          path: ${{ runner.temp }}/diagnostics
      - name: Validate version and layer outputs
        env:
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/diagnostics/app-version-vlmcsd/version-vlmcsd.json"
          test -f "${RUNNER_TEMP}/diagnostics/diagnostics-layer-summary/aggregated_layers.json"
          jq -e '.Layers | type == "array" and length > 0' "${RUNNER_TEMP}/diagnostics/diagnostics-layer-summary/aggregated_layers.json"
          find "${RUNNER_TEMP}/diagnostics" -name "layer-*.json" -print
          test "$(find "${RUNNER_TEMP}/diagnostics" -name "layer-*.json" | wc -l)" -ge 1
          jq -e '.app_branch=="vlmcsd" and .status != null and .version != null' "${RUNNER_TEMP}/diagnostics/app-version-vlmcsd/version-vlmcsd.json"
          while IFS= read -r f; do jq -e '(.image_name | type == "string" and length > 0) and (.Layers | type == "array" and length > 0)' "$f"; done < <(find "${RUNNER_TEMP}/diagnostics" -name "layer-*.json")
          test -f "${RUNNER_TEMP}/diagnostics/layers-alpine_latest-amd64/layers.json"
          jq -e 'type=="array" and length>0' "${RUNNER_TEMP}/diagnostics/layers-alpine_latest-amd64/layers.json"
          test -f "${RUNNER_TEMP}/diagnostics/layer-info-alpine-latest-amd64/image_alpine-latest_amd64.json"
          jq -e '.image=="alpine:latest" and .architecture=="amd64" and (.raw_data.Layers|type=="array" and length>0)' "${RUNNER_TEMP}/diagnostics/layer-info-alpine-latest-amd64/image_alpine-latest_amd64.json"
          if [[ "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" == *"[diagnostics-full]"* ]]; then
            test "$(find "${RUNNER_TEMP}/diagnostics" -name layers.json | wc -l)" -eq 10
            test "$(find "${RUNNER_TEMP}/diagnostics" -name "image_*.json" | wc -l)" -eq 10
            test "$(find "${RUNNER_TEMP}/diagnostics" -name "layer-*.json" | wc -l)" -eq 5
            echo "Full five-image two-architecture parity: PASS"
          fi
          echo "Diagnostic version + layer Artifact contract: PASS"
