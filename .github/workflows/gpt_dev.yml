# Requirements: targets selects the sole Container builder; push validates and schedule monitors.
# Unknowns/research: deferred applications and live daemon capacity need separate evidence.
# Optimization: one build per Target, minimal Docker client tools and shared fixed diagnostics.
# Risks/verification: truthful probe failures, actual/label version parity, all platforms and complete archives; no publishing.
name: Docker Builder - Container (Nonpublishing)
run-name: Docker Builder - ${{ github.event_name }} - ${{ inputs.targets || 'monitor/validate' }}
'on':
  schedule:
  - cron: '0 1 * * *'
  push:
    branches:
    - main
    paths:
    - .github/workflows/gpt_dev.yml
    - README.md
    - scripts/ci/**
    - tests/ci/**
    - application/**
  workflow_dispatch:
    inputs:
      targets:
        description: Configured app[:tag], comma-separated list, or all; builds every configured platform
        type: string
        default: vlmcsd
permissions: write-all
defaults:
  run:
    shell: bash
env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: 'true'
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: '1'
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: '0'
  DOCKER_BUILDKIT: '1'
  COMPOSE_DOCKER_CLI_BUILD: '1'
  CONTAINER_IMAGE: ubuntu:devel
jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
      CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}
    steps:
    - name: Resolve runner-image
      id: resolve-runner-image
      uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main
  plan:
    name: Validate contracts and plan Container targets
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      monitor: ${{ steps.plan.outputs.monitor }}
      version_matrix: ${{ steps.plan.outputs.version_matrix }}
      build_targets: ${{ steps.plan.outputs.build_targets }}
      images: ${{ steps.plan.outputs.images }}
      image_platforms: ${{ steps.plan.outputs.image_platforms }}
    steps:
    - uses: actions/checkout@main
    - name: Check catalog, unit tests and Job dependencies
      run: |
        set -euo pipefail
        python3 scripts/ci/catalog.py validate
        python3 scripts/ci/catalog.py summary --check
        PYTHONPATH="$PWD/scripts/ci" python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
    - name: Plan without network or publication
      id: plan
      env:
        WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
      run: |
        python3 scripts/ci/workflow_plan.py
  fetch-versions:
    name: Fetch ${{ matrix.app_branch }}
    needs:
    - runner-image
    - plan
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.version_matrix).include }}
      max-parallel: 10
    env:
      app_branch: ${{ matrix.app_branch }}
      tag_repo: ${{ matrix.tag_repo || 'latest' }}
      dir_app: application/${{ matrix.app_branch }}
      platform_prefer: linux/amd64
    steps:
    - name: Checkout ${{ github.repository }}
      uses: actions/checkout@main
    - name: Load app env files
      id: env-app
      run: |
        set -euo pipefail
        python3 scripts/ci/catalog.py env --app "${app_branch}" --tag "${tag_repo}" --app-only --output "${GITHUB_ENV}"
    - name: Collect version from meta-app scripts
      id: meta-app
      env:
        container_name: version-meta-app
      working-directory: ${{ github.workspace }}/${{ env.dir_app }}
      run: |
        set -euo pipefail
        version_dir="${RUNNER_TEMP}/app-version"
        mkdir -p "$version_dir"
        log_container="$version_dir/probe-${app_branch}.log"
        : > "$log_container"
        status=success
        version=unknown
        platform_used="$platform_prefer"
        if [[ ",$arch_branch," != *",$platform_prefer,"* ]]; then
          platform_used="${arch_branch%%,*}"
        fi
        cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        collect_version() {
          if ! python3 "$GITHUB_WORKSPACE/scripts/ci/materialize_test_hooks.py" --app "$app_branch" --kind meta >> "$log_container" 2>&1; then
            status=materialize_failed
            return
          fi
          local script="meta-app/meta-app.sh"
          if [[ ! -s "$script" ]]; then
            status=meta_app_missing
            return
          fi
          if ! docker pull --platform "$platform_used" "$base_image" >> "$log_container" 2>&1; then
            status=pull_failed
            return
          fi
          if ! docker run --name "$container_name" --rm --detach --platform "$platform_used" --entrypoint /bin/sh "$base_image" -c 'sleep infinity' >> "$log_container" 2>&1; then
            status=run_failed
            return
          fi
          if ! docker cp "$script" "$container_name:/tmp/meta-app.sh" >> "$log_container" 2>&1; then
            status=copy_failed
            return
          fi
          if ! docker exec --user 0 --workdir /tmp "$container_name" /bin/sh /tmp/meta-app.sh >> "$log_container" 2>&1; then
            status=probe_failed
            return
          fi
          local parsed_version
          if ! parsed_version=$(jq -ern --rawfile log "$log_container" '
            $log | split("\n") | map(select(startswith("version=")) | ltrimstr("version=")) | (last // "") |
            select((gsub("^[[:space:]]+|[[:space:]]+$"; "") | ascii_downcase) as $v | $v != "" and $v != "unknown" and $v != "null") |
            select(test("[\r\n\u0000]") | not)'); then
            status=version_invalid
            return
          fi
          version="$parsed_version"
        }
        collect_version
        cat "$log_container"
        version_json="$version_dir/version-${app_branch}.json"
        jq -n --arg app_branch "$app_branch" --arg tag_repo "$tag_repo" \
          --arg repo_dockerhub "$repo_dockerhub" --arg base_image "$base_image" \
          --arg arch_branch "$arch_branch" --arg platform_used "$platform_used" \
          --arg version "$version" --arg status "$status" --arg updated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          '{app_branch:$app_branch,tag_repo:$tag_repo,repo_dockerhub:$repo_dockerhub,base_image:$base_image,
            arch_branch:$arch_branch,platform_used:$platform_used,version:$version,status:$status,updated_at:$updated_at}' > "$version_json"
        jq . "$version_json"
        printf 'artifact_file=%s\n' "$version_json" >> "$GITHUB_OUTPUT"
    - name: Upload app version artifact
      uses: actions/upload-artifact@main
      with:
        name: app-version-${{ matrix.app_branch }}
        path: |
          ${{ steps.meta-app.outputs.artifact_file }}
          ${{ runner.temp }}/app-version/probe-${{ matrix.app_branch }}.log
        if-no-files-found: error
        retention-days: 1
    if: ${{ needs.plan.outputs.monitor == 'true' }}
  monitor:
    name: Render Monitor State
    needs:
    - runner-image
    - plan
    - fetch-versions
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    steps:
    - name: Checkout ${{ github.repository }}
      uses: actions/checkout@main
    - name: Download app version artifacts
      uses: actions/download-artifact@main
      with:
        path: /tmp/app-version-artifacts
        pattern: app-version-*
        merge-multiple: true
    - name: Render monitor state without building
      run: |
        set -euo pipefail
        python3 scripts/ci/monitor_state.py --artifact-root /tmp/app-version-artifacts --readme-path README.md --output-dir /tmp/monitor-output
        cat /tmp/monitor-output/monitor-report.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload monitor artifacts
      uses: actions/upload-artifact@main
      with:
        name: monitor-output
        path: /tmp/monitor-output/
        retention-days: 1
    if: ${{ needs.plan.outputs.monitor == 'true' }}
  diagnostic-layers:
    name: OCI layers ${{ matrix.image_name }}
    needs:
    - runner-image
    - plan
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    env:
      OS: linux
    steps:
    - name: Setup environment
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y ca-certificates curl gpg skopeo jq
    - name: Fetch Layer Info
      id: fetch
      run: "repo=\"${{ matrix.image_name }}\"\necho \"Inspecting image (all linux platforms): $repo\"\n\nraw=$(skopeo inspect --raw docker://docker.io/\"${repo}\" || true)\n\n# \u63D0\u53D6 multi-arch manifest \u4E2D\u7684 linux \u5E73\u53F0\nplatforms=$(echo \"$raw\" | jq -r '\n    (.manifests? // [])\n    | map(select(.platform.os==\"${{ env.OS }}\"))\n    | .[]\n    | \"\\(.platform.architecture) \\(.platform.variant // \"\")\"\n  ' | sort -u)\n\nif [ -z \"$platforms\" ]; then\n  echo \"No manifest list entries, fallback single inspect.\"\n  single_json=$(skopeo inspect docker://docker.io/\"${repo}\")\n  arch=$(echo \"$single_json\" | jq -r '.Architecture')\n  os=$(echo \"$single_json\" | jq -r '.Os')\n  if [ \"$os\" != \"${{ env.OS }}\" ]; then\n    echo \"Image OS ($os) \u4E0D\u662F ${{ env.OS }}\uFF0C\u9000\u51FA.\" >&2\n    exit 1\n  fi\n  platforms=\"$arch \"\nfi\n\necho \"Found ${{ env.OS }} platform variants:\"\necho \"$platforms\"\n\n# \u4EC5\u751F\u6210\u6587\u4EF6/\u5236\u54C1\u547D\u540D\u6240\u9700\u7684\u6E05\u6D17\u540D\nfile_base=$(echo \"${{ matrix.image_name }}\" | sed 's#[/: ]#-#g')\necho \"file_base=${file_base}\" >> $GITHUB_OUTPUT\n\n# \u805A\u5408\u6240\u6709\u67B6\u6784\u5C42\u5230\u5355\u4E00\u6570\u7EC4\naggregated_layers='[]'\nwhile read -r arch variant; do\n  [ -z \"$arch\" ] && continue\n  echo \"Processing ${{ env.OS }}/$arch${variant:+/$variant}\"\n  data_json=$(skopeo inspect \\\n    --override-os=\"${{ env.OS }}\" \\\n    --override-arch=\"$arch\" \\\n    ${variant:+--override-variant=\"$variant\"} \\\n    --format=json \\\n    docker://docker.io/\"${repo}\")\n  layers_array=$(echo \"$data_json\" | jq -r '.Layers[]' | jq -R -s 'split(\"\\n\")|map(select(length>0))')\n  aggregated_layers=$(echo \"$aggregated_layers\" | jq --argjson new \"$layers_array\" '. + $new')\ndone <<< \"$platforms\"\n\n# \u5E73\u53F0\u5217\u8868\u8F93\u51FA\uFF08\u4FDD\u7559\uFF09\necho \"platforms_json<<EOF\" >> $GITHUB_OUTPUT\necho \"$platforms\" | awk '{print \"${{ env.OS }}/\" $1 (length($2)?\"/\"$2:\"\")}' | jq -R -s 'split(\"\\n\")|map(select(length>0))' >> $GITHUB_OUTPUT\necho \"EOF\" >> $GITHUB_OUTPUT\n\n# \u53BB\u91CD\u5E76\u751F\u6210\u6700\u7EC8\u7ED3\u6784\nunique_layers=$(echo \"$aggregated_layers\" | jq 'unique')\nfinal_json=$(jq -n --arg name \"${{ matrix.image_name }}\" --argjson layers \"$unique_layers\" '{image_name:$name, Layers:$layers}')\n\n# \u5199\u805A\u5408\u6587\u4EF6 (\u4EC5\u6587\u4EF6\u540D\u4F7F\u7528\u6E05\u6D17)\nlayer_file=\"/tmp/layer-${file_base}.json\"\necho \"$final_json\" | jq '.' > \"$layer_file\"\nls -l /tmp/layer-*.json || true\n"
    - name: Upload layer info
      uses: actions/upload-artifact@main
      with:
        name: layers-${{ steps.fetch.outputs.file_base }}
        path: /tmp/layer-*.json
        retention-days: 1
        if-no-files-found: error
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        image_name: ${{ fromJSON(needs.plan.outputs.images) }}
    if: ${{ needs.plan.outputs.build == 'true' }}
  diagnostic-platforms:
    name: Detailed OCI inspect ${{ matrix.image_name }} / ${{ matrix.arch }}
    needs:
    - runner-image
    - plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.image_platforms) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: Install Skopeo
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -qq update
        sudo apt-get -qq install -y skopeo jq
    - name: Inspect immutable platform selector
      id: inspect
      env:
        IMAGE_NAME: ${{ matrix.image_name }}
        ARCH: ${{ matrix.arch }}
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/ci/inspect-image-platform.sh "${IMAGE_NAME}" "${ARCH}"
    - name: Upload original stable layer list artifact
      uses: actions/upload-artifact@main
      with:
        name: layers-${{ steps.inspect.outputs.stable_name }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/diagnostics/layers.json
        if-no-files-found: error
        retention-days: 1
    - name: Upload original baseimage raw-data artifact
      uses: actions/upload-artifact@main
      with:
        name: layer-info-${{ steps.inspect.outputs.base_name }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/diagnostics/image_*.json
        if-no-files-found: error
        retention-days: 1
  diagnostic-collect:
    name: Aggregate OCI Layers
    needs:
    - runner-image
    - plan
    - diagnostic-layers
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: Download per-image layer artifacts
      uses: actions/download-artifact@main
      with:
        pattern: layers-*
        path: ${{ runner.temp }}/layer-artifacts
    - name: Produce JSON summary
      env:
        LAYER_ARTIFACT_ROOT: ${{ runner.temp }}/layer-artifacts
      run: |
        set -euo pipefail
        python3 scripts/ci/aggregate-layer-artifacts.py "${LAYER_ARTIFACT_ROOT}" "${RUNNER_TEMP}/layer-reports"
    - name: Upload merged layers and status report
      uses: actions/upload-artifact@main
      with:
        name: diagnostics-layer-summary
        path: ${{ runner.temp }}/layer-reports/*.json
        retention-days: 1
        if-no-files-found: error
  diagnostic-validate:
    name: Validate diagnostic Artifact contracts
    needs:
    - runner-image
    - plan
    - diagnostic-layers
    - diagnostic-platforms
    - diagnostic-collect
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true' }}
    steps:
    - name: Download diagnostic evidence
      uses: actions/download-artifact@main
      with:
        path: ${{ runner.temp }}/diagnostic-contracts
        pattern: '*layer*'
    - name: Check selected diagnostic contracts
      env:
        DIAGNOSTIC_IMAGES: ${{ needs.plan.outputs.images }}
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path
        images = json.loads(os.environ['DIAGNOSTIC_IMAGES'])
        needs = json.loads(os.environ['JOB_RESULTS'])
        root = Path(os.environ['RUNNER_TEMP']) / 'diagnostic-contracts'
        for job in ['diagnostic-layers', 'diagnostic-platforms', 'diagnostic-collect']:
            assert needs[job]['result'] == 'success', job + ' failed'
        summary = root / 'diagnostics-layer-summary'
        assert json.loads((summary / 'aggregated_layers.json').read_text())['Layers'], 'Empty aggregate layers'
        base_layers = json.loads((summary / 'base_layers.json').read_text())
        assert set(base_layers) == set(images) and all(base_layers.values()), 'Per-image evidence missing'
        layers = list(root.glob('layers-*/layers.json'))
        details = list(root.glob('layer-info-*/image_*.json'))
        expected = {(image, arch) for image in images for arch in ['amd64', 'arm64']}
        assert len(layers) == len(details) == len(expected), 'Per-platform artifacts missing'
        for path in layers:
            assert json.loads(path.read_text()), path
        records = [json.loads(path.read_text()) for path in details]
        assert {(r['image'], r['architecture']) for r in records} == expected
        assert all(r['raw_data']['Layers'] for r in records), 'Empty platform layers'
        print('Fixed diagnostic Artifact contracts: all-platform layers/details PASS')
        PYTHON
  container-build:
    name: Container build ${{ matrix.app_branch }}:${{ matrix.tag_repo }}
    needs:
    - runner-image
    - plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_targets).include }}
    container:
      image: ${{ needs.runner-image.outputs.CONTAINER_IMAGE }}
      options: --user=0:0
      volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env:
      app_branch: ${{ matrix.app_branch }}
      tag_repo: ${{ matrix.tag_repo }}
      registry_local: 127.0.0.1:5000
      PATH_self: ${{ github.workspace }}
      PATH_app: ${{ github.workspace }}/application/${{ matrix.app_branch }}
      PATH_output: ${{ github.workspace }}/container-artifacts/output
      PATH_metadata: ${{ github.workspace }}/container-artifacts/metadata
      PATH_release: ${{ github.workspace }}/container-artifacts/release.md
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
    - name: Install Container tools and Docker client
      run: |
        set -euo pipefail
        apt-get -yqq update
        apt-get -yqq install --no-install-recommends ca-certificates curl git python3 jq xz-utils procps
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        # Only the client is installed. Use a supported Docker package suite with ubuntu:devel.
        printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable\n' "$(dpkg --print-architecture)" > /etc/apt/sources.list.d/docker.list
        apt-get -yqq update
        apt-get -yqq install --no-install-recommends docker-ce-cli docker-buildx-plugin
        apt-get clean
    - name: Checkout exact source
      uses: actions/checkout@main
    - name: Load configured Target and inspect daemon storage
      run: |
        set -euo pipefail
        mkdir -p "$PATH_output" "$PATH_metadata"
        python3 scripts/ci/catalog.py env --app "$app_branch" --tag "$tag_repo" --output "$GITHUB_ENV"
        docker version --format '{{json .}}' > "$PATH_metadata/docker-version.json"
        docker info --format '{{json .}}' > "$PATH_metadata/docker-info.json"
        api=$(jq -r '.Server.ApiVersion' "$PATH_metadata/docker-version.json")
        python3 - "$api" <<'CHECK'
        import sys
        assert tuple(map(int, sys.argv[1].split('.'))) >= (1, 49), 'Docker API 1.49+ is required for platform-specific inspect/save'
        CHECK
        root=$(jq -er '.DockerRootDir | select(startswith("/"))' "$PATH_metadata/docker-info.json")
        # Inspect the actual daemon-side filesystem; never reconfigure/restart the host daemon.
        docker run --rm --mount "type=bind,src=$root,dst=/data,readonly" alpine:latest df -Pk /data | tee "$PATH_metadata/docker-disk.txt"
        printf 'DockerRootDir=%s\n' "$root"
        df -Pk "$PATH_output" | tee "$PATH_metadata/output-disk.txt"
    - name: Enable configured emulated platforms
      run: |
        set -euo pipefail
        if [[ "$arch_branch" != linux/amd64 ]]; then
          docker run --privileged --rm tonistiigi/binfmt --install all
        fi
    - name: Inspect published images without login
      run: |
        set -euo pipefail
        work_dir="$PATH_metadata/inspect-work"
        mkdir -p "$work_dir"
        fatal_count=0
        classify_error() {
          local log="$1"
          if grep -Eiq 'manifest unknown|name unknown|not found|does not exist' "${log}"; then
            printf 'missing'
          elif grep -Eiq 'unauthorized|denied|forbidden|authentication required|insufficient_scope|anonymous token.*403|403 forbidden' "${log}"; then
            printf 'unobservable'
          else
            printf 'inspect_failed'
          fi
        }

        write_registry_status() {
          local out="$1"
          local ref="$2"
          local status="$3"
          local error_file="$4"
          jq -cn \
            --arg reference "${ref}" \
            --arg status "${status}" \
            --rawfile error "${error_file}" '
              {
                reference: $reference,
                status: $status,
                error: ($error | sub("[\\r\\n]+$"; "")),
                source: {raw: null, parsed: null, platforms: {}}
              }' > "${out}"
        }

        inspect_registry() {
          local ref="$1"
          local arch_branch="$2"
          local out="$3"
          local dir="${work_dir}/registry-${RANDOM}-${RANDOM}"
          local raw_file="${dir}/raw.json"
          local parsed_file="${dir}/parsed.json"
          local error_file="${dir}/error.log"
          local platforms_file="${dir}/platforms.jsonl"
          mkdir -p "${dir}"
          : > "${error_file}"
          : > "${platforms_file}"

          if ! docker buildx imagetools inspect "${ref}" --raw > "${raw_file}" 2> "${error_file}"; then
            status=$(classify_error "${error_file}")
            write_registry_status "${out}" "${ref}" "${status}" "${error_file}"
            if [[ "${status}" == inspect_failed ]]; then
              fatal_count=$((fatal_count + 1))
            fi
            rm -rf "${dir}"
            return 0
          fi

          if ! jq -e . "${raw_file}" >/dev/null 2>&1; then
            printf 'imagetools --raw returned invalid JSON\n' > "${error_file}"
            write_registry_status "${out}" "${ref}" inspect_failed "${error_file}"
            fatal_count=$((fatal_count + 1))
            rm -rf "${dir}"
            return 0
          fi

          if ! docker buildx imagetools inspect "${ref}" --format '{{json .}}' > "${parsed_file}" 2> "${error_file}" ||
             ! jq -e . "${parsed_file}" >/dev/null 2>&1; then
            [[ -s "${error_file}" ]] || printf 'imagetools parsed metadata returned invalid JSON\n' > "${error_file}"
            write_registry_status "${out}" "${ref}" inspect_failed "${error_file}"
            fatal_count=$((fatal_count + 1))
            rm -rf "${dir}"
            return 0
          fi

          IFS=',' read -r -a platforms <<< "${arch_branch}"
          for platform in "${platforms[@]}"; do
            platform="${platform//[[:space:]]/}"
            [[ -n "${platform}" ]] || continue
            platform_file="${dir}/platform.json"
            platform_error="${dir}/platform-error.log"
            : > "${platform_error}"

            if docker buildx imagetools inspect "${ref}" \
                 --format "{{json (index .Image \"${platform}\")}}" \
                 > "${platform_file}" 2> "${platform_error}" &&
               jq -e 'type == "object" and . != {}' "${platform_file}" >/dev/null 2>&1; then
              jq -cn \
                --arg platform "${platform}" \
                --arg status present \
                --argjson image "$(cat "${platform_file}")" \
                '{platform: $platform, status: $status, image: $image, error: ""}' \
                >> "${platforms_file}"
              continue
            fi

            if docker buildx imagetools inspect "${ref}" \
                 --format '{{json .Image}}' \
                 > "${platform_file}" 2> "${platform_error}" &&
               jq -e --arg platform "${platform}" '
                 type == "object" and
                 ((.architecture // .Architecture // "") != "") and
                 ((.os // .Os // "") != "") and
                 (($platform | split("/")[0]) == (.os // .Os)) and
                 (($platform | split("/")[1]) == (.architecture // .Architecture))
               ' "${platform_file}" >/dev/null 2>&1; then
              jq -cn \
                --arg platform "${platform}" \
                --arg status present \
                --argjson image "$(cat "${platform_file}")" \
                '{platform: $platform, status: $status, image: $image, error: ""}' \
                >> "${platforms_file}"
            else
              jq -cn \
                --arg platform "${platform}" \
                --rawfile error "${platform_error}" '
                {
                  platform: $platform,
                  status: "missing",
                  image: null,
                  error: ($error | sub("[\\r\\n]+$"; ""))
                }' >> "${platforms_file}"
            fi
          done

          python3 - "${ref}" "${raw_file}" "${parsed_file}" "${platforms_file}" "${out}" <<'PY'
        import json
        import sys
        from pathlib import Path

        ref, raw_path, parsed_path, platforms_path, out_path = sys.argv[1:]
        raw = json.loads(Path(raw_path).read_text(encoding="utf-8"))
        parsed = json.loads(Path(parsed_path).read_text(encoding="utf-8"))
        platforms = {}
        for line in Path(platforms_path).read_text(encoding="utf-8").splitlines():
            if not line.strip():
                continue
            row = json.loads(line)
            platforms[row["platform"]] = {
                "status": row["status"],
                "image": row["image"],
                "error": row["error"],
            }
        result = {
            "reference": ref,
            "status": "present",
            "error": "",
            "source": {
                "raw": raw,
                "parsed": parsed,
                "platforms": platforms,
            },
        }
        Path(out_path).write_text(
            json.dumps(result, ensure_ascii=False, separators=(",", ":")),
            encoding="utf-8",
        )
        PY
          rm -rf "${dir}"
        }


        repo_name="${repo_dockerhub##*/}"
        owner_lower=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        inspect_registry "${repo_dockerhub}:${tag_repo}" "$arch_branch" "$work_dir/dockerhub.json"
        inspect_registry "ghcr.io/${owner_lower}/${repo_name}:${tag_repo}" "$arch_branch" "$work_dir/ghcr.json"
        jq -n --slurpfile dockerhub "$work_dir/dockerhub.json" --slurpfile ghcr "$work_dir/ghcr.json" '{schema_version:1,registries:{dockerhub:$dockerhub[0],ghcr:$ghcr[0]}}' > "$PATH_metadata/baseline.json"
        [[ "$fatal_count" == 0 ]] || { echo '::error::Published-image inspection failed'; exit 1; }
    - name: Probe Meta-app on every configured platform
      id: meta-app
      run: |
        set -euo pipefail
        python3 scripts/ci/materialize_test_hooks.py --app "$app_branch" --kind meta
        script="$PATH_app/meta-app/meta-app.sh"
        [[ -s "$script" ]] || { echo "::error::$app_branch has no Meta-app probe; deferred application, no synthetic version"; exit 1; }
        cleanup() { docker rm -f meta-probe >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        printf '{"app":"%s","tag":"%s","platforms":[]}\n' "$app_branch" "$tag_repo" > "$PATH_metadata/meta-app.json"
        IFS=',' read -ra platforms <<< "$arch_branch"
        for platform in "${platforms[@]}"; do
          label=${platform//\//_}
          docker pull --platform "$platform" "$base_image"
          docker run --name meta-probe --detach --platform "$platform" --entrypoint /bin/sh "$base_image" -c 'sleep infinity'
          docker cp "$script" meta-probe:/tmp/meta-app.sh
          docker exec --user 0 --workdir /tmp --env "build_arg=$build_arg" meta-probe /bin/sh /tmp/meta-app.sh | tee "$PATH_metadata/$label.meta.log"
          detected=$(awk '/^version=/{sub(/^version=/, ""); v=$0} END{print v}' "$PATH_metadata/$label.meta.log")
          jq --arg platform "$platform" --arg version "$detected" '.platforms += [{platform:$platform,version:$version}]' "$PATH_metadata/meta-app.json" > "$PATH_metadata/meta-app.tmp"
          mv "$PATH_metadata/meta-app.tmp" "$PATH_metadata/meta-app.json"
          cleanup
        done
        python3 - <<'CHECK'
        import json
        import os
        from pathlib import Path
        rows = json.loads((Path(os.environ['PATH_metadata']) / 'meta-app.json').read_text())['platforms']
        expected = os.environ['arch_branch'].split(',')
        assert len(rows) == len(expected) and {r['platform'] for r in rows} == set(expected)
        for row in rows:
            value = row['version']
            assert value.strip().lower() not in {'', 'unknown', 'null'} and not any(c in value for c in '\r\n\0'), row
        preferred = next((r for r in rows if r['platform'] == 'linux/amd64'), rows[0])
        with open(os.environ['GITHUB_ENV'], 'a') as stream:
            stream.write('version=' + preferred['version'] + '\n')
        CHECK
    - name: Configure local Buildx exporter
      id: buildx
      run: |
        set -euo pipefail
        config="$PATH_metadata/buildkitd.toml"
        printf '[registry."127.0.0.1:5000"]\n  http = true\n  insecure = true\n' > "$config"
        docker buildx create --name container-builder --driver docker-container --driver-opt network=host --buildkitd-config "$config" --use
        docker buildx inspect --bootstrap
    - name: Start daemon-facing local registry
      id: registry
      run: |
        set -euo pipefail
        docker run --name registry-local --detach --network host --env REGISTRY_HTTP_ADDR=0.0.0.0:5000 registry:latest
        for attempt in {1..30}; do
          if docker run --rm --network host curlimages/curl:8.12.1 -fsS --connect-timeout 2 http://127.0.0.1:5000/v2/; then
            exit 0
          fi
          sleep 2
        done
        docker logs registry-local
        exit 1
    - name: Build all configured platforms into local registry
      id: build
      working-directory: ${{ env.PATH_app }}
      run: |
        set -euo pipefail
        bash "$PATH_self/scripts/ci/build-image.sh"
    - name: Test, compare and export every configured platform
      id: test-export
      run: |
        set -euo pipefail
        python3 scripts/ci/materialize_test_hooks.py --app "$app_branch" --kind test
        cleanup() { docker rm -f image-test >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        printf '{"archives":[]}\n' > "$PATH_metadata/exports.json"
        IFS=',' read -ra platforms <<< "$arch_branch"
        for platform in "${platforms[@]}"; do
          label=${platform//\//_}
          ref="${registry_local}/${repo_dockerhub}:${tag_repo}"
          evidence="$PATH_metadata/$label"
          mkdir -p "$evidence"
          phase=pull
          record_failure() {
            code=$?
            trap - EXIT
            if [[ "$code" != 0 ]]; then
              jq -n --arg sha "$GITHUB_SHA" --arg app "$app_branch" --arg tag "$tag_repo" --arg platform "$platform" --arg phase "$phase" --argjson code "$code" '{sha:$sha,app:$app,tag:$tag,platform:$platform,phase:$phase,exit_code:$code}' > "$evidence/result.json"
            fi
            cleanup
            exit "$code"
          }
          trap record_failure EXIT
          docker pull --platform "$platform" "$ref"
          docker image inspect --platform "$platform" "$ref" > "$evidence/image.json"
          docker image history --platform "$platform" --no-trunc --human=false --format '{{json .}}' "$ref" | jq -s . > "$evidence/history.json"
          phase=platform
          python3 - "$evidence/image.json" "$platform" <<'PLATFORM'
        import json
        import sys
        row = json.load(open(sys.argv[1]))[0]
        expected = sys.argv[2].split('/')
        assert [row['Os'], row['Architecture']] == expected[:2], 'Image platform mismatch'
        assert len(expected) < 3 or row.get('Variant') == expected[2], 'Image variant mismatch'
        PLATFORM
          phase=test
          docker run --name image-test --detach --platform "$platform" --entrypoint /bin/sh "$ref" -c 'sleep infinity'
          docker cp "$PATH_app/test" image-test:/tmp/test
          docker exec --user 0 --workdir /tmp/test image-test /bin/sh /tmp/test/test.sh | tee "$evidence/test.log"
          cleanup
          phase=version
          actual_version=$(awk '/^version=/{sub(/^version=/, ""); v=$0} END{print v}' "$evidence/test.log")
          python3 - "$actual_version" "$evidence/image.json" <<'VERSION'
        import json
        import os
        import sys
        value = sys.argv[1]
        assert value.strip().lower() not in {'', 'unknown', 'null'} and not any(c in value for c in '\r\n\0'), 'Actual test version missing/invalid'
        expected = os.environ['version']
        assert value == expected, f'Actual version {value!r} differs from build metadata {expected!r}'
        image = json.load(open(sys.argv[2]))[0]
        label = (image.get('Config', {}).get('Labels') or {}).get('version')
        assert label == expected, f'Image version label {label!r} differs from build metadata {expected!r}'
        VERSION
          phase=compare
          jq -n --arg platform "$platform" --arg actual_version "$actual_version" --slurpfile image "$evidence/image.json" --slurpfile history "$evidence/history.json" '{platform:$platform,actual_version:$actual_version,test_result:"success",source:{image_inspect:$image[0],image_history:$history[0]}}' > "$evidence/snapshot.json"
          python3 scripts/ci/compare_image_snapshot.py "$PATH_metadata/baseline.json" "$evidence/snapshot.json" "$platform" "$evidence/comparison.json"
          [[ "$(jq -r '.comparison.result' "$evidence/comparison.json")" != UNKNOWN ]] || { echo '::error::OCI comparison UNKNOWN'; exit 1; }
          phase=export
          # Archive names do not depend on untrusted/free-form version strings.
          version_file=$(python3 -c 'import os,re; print(re.sub(r"[^A-Za-z0-9_.-]+", "-", os.environ["version"]))')
          name="${app_branch}_${tag_repo}_${version_file}_${label}.tar"
          docker tag "$ref" "${repo_dockerhub}:${tag_repo}"
          docker image save --platform "$platform" --output "$PATH_output/$name" "${repo_dockerhub}:${tag_repo}"
          python3 scripts/ci/verify_image_archive.py "$PATH_output/$name" "$platform"
          digest=$(sha256sum "$PATH_output/$name" | cut -d' ' -f1)
          jq --arg platform "$platform" --arg filename "$name" --arg sha256 "$digest" '.archives += [{platform:$platform,filename:$filename,sha256:$sha256}]' "$PATH_metadata/exports.json" > "$PATH_metadata/exports.tmp"
          mv "$PATH_metadata/exports.tmp" "$PATH_metadata/exports.json"
          jq -n --arg sha "$GITHUB_SHA" --arg platform "$platform" --arg app "$app_branch" --arg tag "$tag_repo" '{sha:$sha,app:$app,tag:$tag,platform:$platform,phase:"complete",exit_code:0}' > "$evidence/result.json"
        done
        trap cleanup EXIT
        python3 - <<'CONSISTENCY'
        import json
        import os
        from pathlib import Path
        root = Path(os.environ['PATH_metadata'])
        versions = [json.loads((root / p.replace('/', '_') / 'snapshot.json').read_text())['actual_version'] for p in os.environ['arch_branch'].split(',')]
        assert len(set(versions)) == 1, 'Declared platforms produced different actual versions'
        CONSISTENCY
    - name: Free build storage before compression
      id: free-storage
      run: |
        set -euo pipefail
        docker buildx rm container-builder
        docker rm -fv registry-local
        docker image rm "${registry_local}/${repo_dockerhub}:${tag_repo}" "${repo_dockerhub}:${tag_repo}"
        df -Pk "$PATH_output"
    - name: Compress image archives
      id: compress
      uses: Grinch27/github-actions/.github/actions/compress-xz@main
      with:
        path_target: ${{ env.PATH_output }}
        pattern_match: ^\./.*\.tar$
    - name: Split large compressed archives
      id: split
      uses: Grinch27/github-actions/.github/actions/file-split@main
      with:
        path_target: ${{ env.PATH_output }}
        pattern_match: ^\./.*\.tar\.xz$
        split_size: 1900M
    - name: Verify complete compressed export set
      id: verify-outputs
      run: |
        set -euo pipefail
        python3 scripts/ci/verify_image_archive.py --outputs "$PATH_output" --manifest "$PATH_metadata/exports.json" --platforms "$arch_branch" --metadata "$PATH_metadata/metadata_sum.json"
    - name: Write offline artifact report
      id: report
      run: |
        set -euo pipefail
        {
          printf '# %s:%s\n\n' "$app_branch" "$tag_repo"
          printf 'Source: `%s`\n\nPlatforms: `%s`\n\n' "$GITHUB_SHA" "$arch_branch"
          printf 'Nonpublishing acceptance: local Registry, README Test, OCI comparison, platform archives and xz integrity.\n\n'
          printf 'For split files, concatenate `.partNNN` in numeric order, then decompress with `xz -d` and load with `docker load`.\n\n'
          printf 'Raw tar and uploaded-file SHA256 values: `metadata/metadata_sum.json`.\n'
        } > "$PATH_release"
        cat "$PATH_release" >> "$GITHUB_STEP_SUMMARY"
    - name: Enforce complete Container acceptance
      if: always() && !cancelled()
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
      run: |
        set -euo pipefail
        python3 - <<'CHECK'
        import json
        import os
        steps = json.loads(os.environ['STEP_RESULTS'])
        for key in ['meta-app', 'buildx', 'registry', 'build', 'test-export', 'free-storage', 'compress', 'split', 'verify-outputs', 'report']:
            assert steps[key]['conclusion'] == 'success', key + ' did not succeed'
        print('Container acceptance: all configured platforms/build/test/compare/export/xz PASS; external publication=0')
        CHECK
    - name: Upload Container acceptance evidence
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: container-acceptance-${{ matrix.app_branch }}-${{ matrix.tag_repo }}-a${{ github.run_attempt }}
        path: ${{ github.workspace }}/container-artifacts/
        if-no-files-found: error
        retention-days: 1
    - name: Clean only this build resources
      if: always()
      run: |
        set -euo pipefail
        docker rm -fv meta-probe image-test registry-local >/dev/null 2>&1 || true
        docker buildx rm container-builder >/dev/null 2>&1 || true
